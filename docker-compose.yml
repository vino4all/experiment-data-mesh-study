version: '3.8'

services:
  # PostgreSQL - Client Domain
  client-db:
    image: postgres:15.18-alpine
    container_name: client-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datamesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_CLIENT:-client_db}
    ports:
      - "127.0.0.1:${CLIENT_DB_PORT_HOST:-55432}:5432"
    volumes:
      - client_db_data:/var/lib/postgresql/data
      - ./db/client-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datamesh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Orders Domain
  orders-db:
    image: postgres:15.18-alpine
    container_name: orders-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datamesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_ORDERS:-orders_db}
    ports:
      - "127.0.0.1:${ORDERS_DB_PORT_HOST:-5433}:5432"
    volumes:
      - orders_db_data:/var/lib/postgresql/data
      - ./db/orders-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datamesh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-29092}:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka

  # Client Service
  client-service:
    build:
      context: ./services/client-service
      dockerfile: Dockerfile
    container_name: client-service
    ports:
      - "127.0.0.1:${CLIENT_SERVICE_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-datamesh}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@client-db:5432/${POSTGRES_DB_CLIENT:-client_db}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC_CLIENT_EVENTS:-client-events}
      NODE_ENV: production
      PORT: 3001
    volumes:
      - ./services/client-service/src:/app/src
    depends_on:
      client-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Orders Service - API Pattern
  orders-service:
    build:
      context: ./services/orders-service
      dockerfile: Dockerfile
    container_name: orders-service
    ports:
      - "127.0.0.1:${ORDERS_SERVICE_PORT:-3002}:3002"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-datamesh}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@orders-db:5432/${POSTGRES_DB_ORDERS:-orders_db}
      CLIENT_SERVICE_URL: http://client-service:3001
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC_CLIENT_EVENTS:-client-events}
      NODE_ENV: production
      PORT: 3002
    volumes:
      - ./services/orders-service/src:/app/src
    depends_on:
      orders-db:
        condition: service_healthy
      client-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3002/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Orders Projection Consumer - Event-Driven Pattern
  orders-projection-consumer:
    build:
      context: ./services/orders-projection-consumer
      dockerfile: Dockerfile
    container_name: orders-projection-consumer
    ports:
      - "127.0.0.1:${PROJECTION_CONSUMER_PORT:-3003}:3003"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-datamesh}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@orders-db:5432/${POSTGRES_DB_ORDERS:-orders_db}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC_CLIENT_EVENTS:-client-events}
      KAFKA_GROUP: orders-projection-group
      NODE_ENV: production
    volumes:
      - ./services/orders-projection-consumer/src:/app/src
    depends_on:
      orders-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3003/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Batch Sync Worker - Batch Pattern
  batch-sync-worker:
    build:
      context: ./services/batch-sync-worker
      dockerfile: Dockerfile
    container_name: batch-sync-worker
    ports:
      - "127.0.0.1:${BATCH_WORKER_PORT:-3004}:3004"
    environment:
      SOURCE_DATABASE_URL: postgresql://${POSTGRES_USER:-datamesh}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@client-db:5432/${POSTGRES_DB_CLIENT:-client_db}
      TARGET_DATABASE_URL: postgresql://${POSTGRES_USER:-datamesh}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@orders-db:5432/${POSTGRES_DB_ORDERS:-orders_db}
      BATCH_SYNC_INTERVAL_MS: ${BATCH_SYNC_INTERVAL_MS:-30000}
      NODE_ENV: production
    volumes:
      - ./services/batch-sync-worker/src:/app/src
    depends_on:
      client-db:
        condition: service_healthy
      orders-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3004/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  # Grafana
  grafana:
    image: grafana/grafana:13.0.2
    container_name: grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus

volumes:
  client_db_data:
  orders_db_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: data-mesh-network
